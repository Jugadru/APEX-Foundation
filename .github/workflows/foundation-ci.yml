name: APEX Foundation CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate Foundation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          python3 --version | tee ci-results/python.log
          python3 tools/apex_foundation_registry.py validate | tee ci-results/registry.log
          python3 tools/apex_foundation_registry.py check artifact.v1 docs/foundation/artifact.example.json | tee ci-results/example.log
          python3 tools/apex_foundation_registry.py search REF-001 | tee ci-results/search.log
          python3 tools/apex_knowledge.py validate | tee ci-results/knowledge.log
          python3 tools/apex_knowledge.py queue --limit 20 | tee ci-results/research-queue.log
          python3 tools/apex_knowledge.py plan IDEA-001 | tee ci-results/research-plan.log
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v 2>&1 | tee ci-results/tests.log
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundation-ci-logs
          path: ci-results/
          retention-days: 14
