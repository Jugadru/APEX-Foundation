name: APEX Foundation CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate Foundation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          python3 --version | tee ci-results/python.log
          python3 tools/apex_foundation_registry.py validate | tee ci-results/registry.log
          python3 tools/apex_foundation_registry.py check artifact.v1 docs/foundation/artifact.example.json | tee ci-results/example.log
          python3 tools/apex_foundation_registry.py search REF-001 | tee ci-results/search.log
          python3 tools/apex_knowledge.py validate | tee ci-results/knowledge.log
          python3 tools/apex_knowledge.py queue --limit 20 | tee ci-results/research-queue.log
          python3 tools/apex_knowledge.py audit | tee ci-results/consumer-audit.log
          python3 tools/apex_knowledge.py plan IDEA-001 | tee ci-results/research-plan.log
          python3 tools/apex_architecture.py validate | tee ci-results/architecture.log
          python3 tools/apex_architecture.py graph | tee ci-results/architecture-graph.log
          python3 tools/apex_architecture.py contract-diff | tee ci-results/contract-diff.log
          python3 tools/apex_architecture.py impact docs/architecture/change.example.json | tee ci-results/architecture-impact.log
          python3 tools/apex_architecture.py gate docs/architecture/change.foundation.example.json | tee ci-results/architecture-gate.log
          python3 tools/apex_data_center.py validate | tee ci-results/data-center.log
          python3 tools/apex_data_center.py diff vehicle-fixture 1.0.0 1.1.0 | tee ci-results/data-diff.log
          python3 tools/apex_data_center.py convert 180 kmh mps | tee ci-results/data-units.log
          set +e
          python3 tools/apex_data_center.py gate vehicle-fixture 1.1.0 core2 9dfc18de49083260b1a9524513b415e1551fdabf > ci-results/data-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          python3 tools/apex_content_registry.py validate | tee ci-results/content.log
          python3 tools/apex_content_registry.py graph vehicle.demo 1.0.0 | tee ci-results/content-graph.log
          python3 tools/apex_content_registry.py diff driver.demo 1.0.0 1.1.0 | tee ci-results/content-diff.log
          set +e
          python3 tools/apex_content_registry.py gate vehicle.demo 1.0.0 core2 9dfc18de49083260b1a9524513b415e1551fdabf > ci-results/content-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          python3 tools/apex_config.py validate | tee ci-results/config.log
          python3 tools/apex_config.py resolve hyper-technical 1.0.0 | tee ci-results/config-resolved.log
          python3 tools/apex_config.py diff core2-development 1.0.0 1.1.0 | tee ci-results/config-diff.log
          python3 tools/apex_config.py rollback core2-development 1.1.0 | tee ci-results/config-rollback.log
          set +e
          python3 tools/apex_config.py gate hyper-development 1.0.0 hyper 80faba05374355f31906a630f576036aecca4f56 > ci-results/config-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          python3 tools/apex_persistence.py validate | tee ci-results/persistence.log
          python3 tools/apex_persistence.py simulate career-baseline 3.0.0 | tee ci-results/persistence-migration.log
          python3 tools/apex_persistence.py recover corrupt-primary | tee ci-results/persistence-recovery.log
          set +e
          python3 tools/apex_persistence.py inspect career-corrupt > ci-results/persistence-corrupt.json
          corrupt_status=$?
          python3 tools/apex_persistence.py gate career-baseline core2 9dfc18de49083260b1a9524513b415e1551fdabf > ci-results/persistence-gate.json
          gate_status=$?
          set -e
          test "$corrupt_status" -eq 1
          test "$gate_status" -eq 1
          python3 tools/apex_evidence.py validate | tee ci-results/evidence.log
          python3 tools/apex_evidence.py history | tee ci-results/evidence-history.log
          python3 tools/apex_evidence.py verify fixture.bytes | tee ci-results/evidence-integrity.log
          python3 tools/apex_evidence.py compare demo.baseline demo.candidate | tee ci-results/evidence-comparison.log
          set +e
          python3 tools/apex_evidence.py gate 47f18184ece6473242b56c695e06512f5ef769d6 > ci-results/evidence-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          python3 tools/apex_modding.py validate | tee ci-results/modding.log
          python3 tools/apex_modding.py plan docs/modding/selection.example.json | tee ci-results/modding-plan.log
          python3 tools/apex_modding.py package demo.driver 1.0.0 | tee ci-results/modding-package.log
          python3 tools/apex_modding.py remove docs/modding/selection.example.json demo.season | tee ci-results/modding-remove.log
          set +e
          python3 tools/apex_modding.py plan docs/modding/conflict.example.json > ci-results/modding-conflict.json
          conflict_status=$?
          python3 tools/apex_modding.py gate docs/modding/selection.example.json > ci-results/modding-gate.json
          gate_status=$?
          set -e
          test "$conflict_status" -eq 1
          test "$gate_status" -eq 1
          python3 tools/apex.py doctor | tee ci-results/integration-doctor.log
          python3 tools/apex.py catalog | tee ci-results/integration-catalog.log
          python3 tools/apex.py request docs/integration/request.example.json | tee ci-results/integration-request.log
          python3 tools/apex.py scenario | tee ci-results/integration-scenario.log
          python3 tools/apex.py drift | tee ci-results/integration-drift.log
          python3 tools/apex.py debt | tee ci-results/integration-debt.log
          set +e
          python3 tools/apex.py plan core2 524bd90a19aeaafe6920b4cdb774c77729d78fbd > ci-results/integration-plan.json
          plan_status=$?
          set -e
          test "$plan_status" -eq 1
          python3 tools/apex.py reconcile | tee ci-results/reconciliation.log
          python3 tools/apex.py native-evidence | tee ci-results/native-evidence.log
          python3 tools/apex.py candidates | tee ci-results/source-candidates.log
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v 2>&1 | tee ci-results/tests.log
      - name: Checkout reviewed Core 2 metadata producer (sparse, exact revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Jugadru/APEX-Simulation
          ref: 561b19d105b3c1c4d19254ee158538095bf5b30f
          path: .core2-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/apex_foundation_metadata.py
            /data/season_2012.json
            /data/teams.json
      - name: Verify real cross-repository Core 2 metadata contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .core2-source rev-parse HEAD)" = "561b19d105b3c1c4d19254ee158538095bf5b30f"
          python3 .core2-source/tools/apex_foundation_metadata.py > "$RUNNER_TEMP/core2-metadata.json"
          python3 tools/apex_core2_metadata.py "$RUNNER_TEMP/core2-metadata.json" \
            --revision 561b19d105b3c1c4d19254ee158538095bf5b30f --source-root .core2-source | tee ci-results/core2-adapter-verification.json
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundation-ci-logs
          path: ci-results/
          retention-days: 14

  minimum-python:
    name: Foundation Python 3.10.22
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10.22'
      - name: Validate minimum interpreter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results-minimum
          python --version | tee ci-results-minimum/python.log
          python -c 'import sys; assert sys.version_info[:3] == (3, 10, 22)'
          python tools/apex.py doctor | tee ci-results-minimum/doctor.log
          python tools/apex.py scenario | tee ci-results-minimum/scenario.log
          python tools/apex.py reconcile | tee ci-results-minimum/reconciliation.log
          python -m unittest discover -s tools/tests -p 'test_*.py' -v 2>&1 | tee ci-results-minimum/tests.log
      - name: Retain minimum interpreter logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: foundation-ci-python310
          path: ci-results-minimum/
          retention-days: 14
